<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAKUN NGAHIJI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<header class="bg-blue-800 text-white p-4 text-center">
  <h1 class="text-2xl font-bold">JAKUN NGAHIJI</h1>
  <p>RW 07, RT 13 & RT 14</p>
</header>

<div id="login" class="p-4">
  <div class="bg-white p-6 rounded shadow text-center">
    <h2 class="text-xl font-bold mb-4">Selamat Datang</h2>
    <button onclick="alert('Masuk sebagai Warga')" class="w-full bg-blue-600 text-white py-3 rounded mb-2">Akses Warga</button>
    <button onclick="document.getElementById('login').style.display='none';document.getElementById('admin').style.display='block'" class="w-full bg-orange-500 text-white py-3 rounded">Akses Admin</button>
  </div>
</div>

<div id="admin" style="display:none" class="p-4">
  <h2 class="font-bold mb-2">Login Admin</h2>
  <input id="user" placeholder="Username" class="w-full border p-2 mb-2">
  <input id="pass" type="password" placeholder="Password" class="w-full border p-2 mb-2">
  <button onclick="if(document.getElementById('user').value=='admin'){document.getElementById('admin').style.display='none';document.getElementById('app').style.display='block'}else{alert('salah')}" class="w-full bg-blue-600 text-white py-2 rounded">Login</button>
</div>

<div id="app" style="display:none" class="p-4">
  <button onclick="document.getElementById('form').style.display='block'" class="bg-blue-600 text-white px-4 py-2 rounded">+ Tambah KK Baru</button>
  <div id="form" style="display:none" class="bg-white p-4 mt-3 rounded shadow">
    <input id="nama" placeholder="Nama Kepala KK" class="w-full border p-2 mb-2">
    <button onclick="alert('Data '+document.getElementById('nama').value+' disimpan')" class="bg-green-600 text-white px-4 py-2 rounded">Simpan</button>
  </div>
</div>
</body>
</html>
